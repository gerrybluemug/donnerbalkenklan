# Aktualisiert die Mitgliederliste einmal täglich und veröffentlicht die Seite
# über GitHub Pages. (Repository → Settings → Pages → Source: "GitHub Actions")
name: Mitgliederliste aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich um 04:17 UTC
  workflow_dispatch:        # manuell über den "Run workflow"-Knopf
    inputs:
      bank_export:
        description: "Gildenbank: Export-Text aus dem Addon (/gbank export) hier einfügen. Leer lassen, um nur die Mitgliederliste zu aktualisieren."
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Daten aus der Armory holen
        continue-on-error: true   # bei Fehlern bleibt die alte Liste online
        run: node scripts/update-roster.mjs

      - name: Gildenbank importieren
        if: ${{ inputs.bank_export != '' && inputs.bank_export != null }}
        env:
          BANK_EXPORT: ${{ inputs.bank_export }}
        run: node scripts/import-bank.mjs --env

      - name: Neue Daten committen
        run: |
          git config user.name "roster-bot"
          git config user.email "roster-bot@users.noreply.github.com"
          git add data/roster.js data/bank.js data/history.js
          git diff --cached --quiet || git commit -m "Daten aktualisiert (Mitglieder/Gildenbank)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
